<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spot — gym equipment waitlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="bar">
    <button id="back" hidden aria-label="Go back">Back</button>
    <span class="brand">Spot</span>
    <button id="checkin">Check out</button>
    <button id="speed" aria-pressed="false" title="Prototype control: speeds up timers">30x time</button>
  </header>
  <main id="screen"></main>
</div>
<div class="modal" id="modal" role="alertdialog" aria-modal="true" aria-labelledby="mt" hidden><div class="box"><p id="mt">Are you sure you want to check out? You'll lose your current session and waitlists</p><button class="btn danger" id="co-yes">Check out</button><button class="btn alt" id="co-no">Stay checked in</button></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
